<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>安助</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="安助">
<meta name="theme-color" content="#1E2940">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 學生手帳式單欄 App，頂部日期抬頭 + 底部四格導航；螢光筆黃標出"重點" */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#1E2940; --muted:#68728A; --line:#D6DCE6;
  --accent:#3550C8; --accent-soft:#E3E8FB; --hi:#FFD84D; --good:#2B8A5E; --bad:#C8461A;
  --c1:#E8590C; --c2:#1C7ED6; --c3:#AE3EC9; --c4:#2B8A5E; --c5:#E8A00C; --c6:#868E96;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#97A0B4; --line:#2B3344;
  --accent:#8199FF; --accent-soft:#252E4D; --hi:#E5C340; --good:#4CC28A; --bad:#FF8A5C;
  --c1:#FF8F4A; --c2:#5AAFFF; --c3:#D07BEA; --c4:#4CC28A; --c5:#F2C14E; --c6:#A5ADB8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#97A0B4; --line:#2B3344;
  --accent:#8199FF; --accent-soft:#252E4D; --hi:#E5C340; --good:#4CC28A; --bad:#FF8A5C;
  --c1:#FF8F4A; --c2:#5AAFFF; --c3:#D07BEA; --c4:#4CC28A; --c5:#F2C14E; --c6:#A5ADB8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
header.top{padding-block:22px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.02em;margin:0}
.brand mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
.brand .sub{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-left:6px}
.date{font-size:13px;color:var(--muted)}
.date b{font-family:var(--num);color:var(--ink);font-weight:600}
.ex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.ex button{margin-left:auto}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:22px 0 10px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:30px;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
button,.btn{font:inherit;font-size:14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] button.primary{color:#0E1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0E1220}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > *{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.full{grid-column:1/-1}
/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px}
.tile:hover{border-color:var(--accent)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over > i{background:var(--bad)}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item > div{min-width:0}
.dot{width:10px;height:10px;border-radius:50%}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cats{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:52px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.catrow .num{text-align:right}
/* timetable */
.tt-scroll{overflow-x:auto}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:340px;table-layout:fixed}
.tt th{font-size:12px;font-weight:500;color:var(--muted);padding:4px 0}
.tt th.today{color:var(--ink)}
.tt th.today span{background:linear-gradient(transparent 50%,var(--hi) 50%);padding:0 3px}
.tt td.p{font-size:11px;color:var(--muted);text-align:center;width:44px;line-height:1.2}
.tt td.p b{display:block;font-family:var(--num);color:var(--ink);font-size:13px}
.cell{width:100%;height:56px;padding:4px;border-radius:8px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.cell.has{border:0;background:var(--accent-soft);color:var(--ink);font-weight:500}
.cell.has small{font-weight:400;color:var(--muted);font-size:10px;display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;max-width:100%}
.cell.now{outline:2px solid var(--hi);outline-offset:0}
.lunch td{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(10 14 24 / .45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
/* split */
.members{display:flex;flex-wrap:wrap;gap:8px}
.settle{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg)}
.settle .arrow{color:var(--muted)}
.ok{color:var(--good)} .neg{color:var(--bad)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;padding:6px 0;border-radius:10px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent);font-weight:700}
.empty{padding:14px 0;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:60}
.ai{border-color:var(--accent);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 60%)}
.aiout{white-space:pre-wrap;line-height:1.75;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
button:disabled{opacity:.55;cursor:default}
.aiset{background:var(--accent-soft);border-radius:12px;padding:12px}
.aiset input{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:13px;background:var(--surface);color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--surface);font-weight:600}
.paytag{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;border:1px solid var(--line)}
.paytag.p-card{color:var(--accent);border-color:var(--accent)}
.paytag.p-cash{color:var(--good);border-color:var(--good)}
.paybox{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--bg);border:2px solid transparent;cursor:pointer}
.paybox.on{border-color:var(--accent)}
.paybox.static{cursor:default;gap:6px}
.paybox.static button{font-size:13px;padding:6px 10px;align-self:flex-start}
.paybox .big{font-size:22px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.pdot.p-cash{background:var(--good)}.pdot.p-card{background:var(--accent)}
.bar2{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--bg)}
.bar2 i{display:block;height:100%}
.met{align-items:stretch}
.metbpm{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:4px}
.metnum{font-size:56px;line-height:1;text-align:center}
.bstep{font-size:16px;font-weight:600;color:var(--ink);padding:8px 10px;border:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--accent)}
.metdots{display:flex;justify-content:center;gap:12px;padding:6px 0}
.metdots span{width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:transform .06s}
.metdots span.acc{border-color:var(--accent)}
.metdots span.hit{background:var(--accent);border-color:var(--accent);transform:scale(1.2)}
.metdots span.acc.hit{background:var(--hi);border-color:var(--hi)}
.metgo{min-width:140px;font-size:17px;padding:12px 20px}
#metTap.tapped{background:var(--accent-soft)}
.prclock{font-size:48px;text-align:center;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3>*{min-width:0}.grid3 .big{font-size:22px}
.mhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:18px 0 8px}
.mhead h2{margin:0;text-align:center}
.mnav{font-size:28px;line-height:1;padding:2px 14px;color:var(--ink)}
.itemb{width:100%;background:none;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;padding:10px 0;color:var(--ink);font:inherit;cursor:pointer}
.itemb:first-child{border-top:0}
.catb{width:100%;background:none;border:0;padding:2px 0;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.catrow{grid-template-columns:52px 1fr 108px}
.cell.has{background:var(--accent-soft);background:color-mix(in srgb,var(--cc,var(--accent)) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--cc,var(--accent))}
.prow{display:grid;grid-template-columns:24px 1fr auto 1fr;gap:8px;align-items:center}
.prow input{width:100%;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer}
.sw{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.evs{margin-bottom:12px}
.evs .chip{font-size:13px;padding:5px 12px;cursor:pointer}
.settle button{font-size:13px;padding:6px 10px}
.gear{font-size:13px;padding:4px 8px}
textarea{font:13px/1.4 var(--num);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;resize:vertical;word-break:break-all}
.lkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lkwrap{position:relative;min-width:0}
.lk{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;text-decoration:none;color:var(--ink);cursor:pointer;text-align:center}
.lk:hover{border-color:var(--accent)}
.lkname{font-size:14px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.lkic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:19px;color:var(--surface)}
.lk-web{background:var(--accent)}.lk-app{background:var(--c3)}.lk-doc{background:var(--good)}
.lkdel{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;background:var(--bad);border-color:var(--bad);color:var(--surface);font-size:12px;z-index:2}
@media (max-width:420px){.lkgrid{gap:8px}.lk{padding:12px 4px}.lkname{font-size:13px}}
.chatlog{display:flex;flex-direction:column;gap:12px;padding-block:4px 12px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.note{align-self:center;background:transparent;color:var(--muted);font-size:13px;padding:2px 8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{font-size:13px;border-radius:99px;padding:6px 12px;background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chatform{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--bg);padding-block:8px}
.chatform input{font-size:16px;padding:11px 12px}
.quick{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin-bottom:12px}
.quick input{font-size:16px;padding:11px 12px}
.quick button{padding:11px 18px}
.quick .full{grid-column:1/-1}
label.btn.primary-l{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500;display:inline-block}
label.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.aitile{width:100%;margin-top:12px;display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;border-color:var(--accent);background:linear-gradient(120deg,var(--accent-soft),var(--surface) 70%)}
.aitile .spark{font-size:24px;color:var(--accent);background:var(--surface);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar > i{transition:width .4s ease}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">安<mark>助</mark> <span class="sub">我的生活小助手</span></h1>
    <div class="row" style="gap:6px"><div class="date" id="today"></div><button class="ghost gear" id="openSet">⚙ 設定</button></div>
  </header>
  <div class="ex" id="exBanner" hidden>
    <span>現在顯示的是<b>範例資料</b>，方便你先看看效果。</span>
    <button id="clearEx">清空，從頭開始</button>
  </div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="功能">
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首頁</a>
  <a href="#money" data-t="money"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>記帳</a>
  <a href="#timetable" data-t="timetable"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12M8 2v4M16 2v4"/></svg>課表</a>
  <a href="#practice" data-t="practice"><svg viewBox="0 0 24 24"><path d="M7 21h10L14 3h-4z"/><path d="M12 15l5-7"/><path d="M8.5 17h7"/></svg>練習</a>
  <a href="#chat" data-t="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8.2l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg>問 AI</a>
</nav>
<div id="sheetHost"></div>

<script>
const KEY='lifehelper_v1';
const CATS=[['餐飲','--c1'],['交通','--c2'],['娛樂','--c3'],['學習','--c4'],['購物','--c5'],['其他','--c6']];
const DAY_NAMES=['一','二','三','四','五','六'];
let DAYS=DAY_NAMES.slice(0,5);
const DEFAULT_PERIODS=[['08:10','09:00'],['09:10','10:00'],['10:10','11:00'],['11:10','12:00'],['13:10','14:00'],['14:10','15:00'],['15:10','16:00'],['16:10','17:00']];
let PERIODS=DEFAULT_PERIODS.map(p=>p.slice());
const COLORS=['--accent','--c1','--c2','--c3','--c4','--c5'];
const b64e=x=>btoa(unescape(encodeURIComponent(x)));
const b64d=x=>decodeURIComponent(escape(atob(x)));
const toMin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m};
const fromMin=n=>pad(Math.floor(n/60)%24)+':'+pad(n%60);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function seed(){
  const now=new Date(), y=now.getFullYear(), m=pad(now.getMonth()+1);
  const d=n=>`${y}-${m}-${pad(Math.min(n,now.getDate()))}`;
  return {example:true,budget:6000,
    expenses:[
      {id:uid(),date:d(1),cat:'交通',amt:1280,note:'TPASS 月票',pay:'card',ex:true},
      {id:uid(),date:d(5),cat:'學習',amt:450,note:'程式設計課本',pay:'cash',ex:true},
      {id:uid(),date:d(12),cat:'娛樂',amt:330,note:'電影票',pay:'card',ex:true},
      {id:uid(),date:d(20),cat:'購物',amt:590,note:'耳機',pay:'card',ex:true},
      {id:uid(),date:d(26),cat:'餐飲',amt:180,note:'和同學吃拉麵',pay:'cash',ex:true},

function balances(){
  const b={};S.split.members.forEach(m=>b[m]=0);
  S.split.items.forEach(it=>{const among=it.among.filter(x=>x in b);if(!among.length)return;
    b[it.payer]=(b[it.payer]||0)+it.amt;const share=it.amt/among.length;among.forEach(m=>b[m]-=share)});
  S.split.paid.forEach(x=>{if(x.from in b)b[x.from]+=x.amt;if(x.to in b)b[x.to]-=x.amt});
  return b;
}
function transfers(){
  const b=balances();const cr=[],db=[];
  for(const[k,v]of Object.entries(b)){if(v>0.5)cr.push([k,v]);else if(v<-0.5)db.push([k,-v])}
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);out.push([db[i][0],cr[j][0],x]);
    db[i][1]-=x;cr[j][1]-=x;if(db[i][1]<0.5)i++;if(cr[j][1]<0.5)j++}
  return out;
}

const GEM_KEY='anzhu_gemini';
const GEM_MODELS=['gemini-flash-lite-latest','gemini-3.5-flash-lite','gemini-flash-latest','gemini-3.8-flash','gemini-3.6-flash','gemini-2.5-flash'];
function gemCfg(){let c={};try{c=JSON.parse(localStorage.getItem(GEM_KEY)||'null')||{}}catch(e){}
  if(c.key&&c.v2!==3){c.v2=3;if(!c.model||/^gemini-3\.(8|6)-flash$|^gemini-3\.5-flash-lite$/.test(c.model))c.model=GEM_MODELS[0];try{localStorage.setItem(GEM_KEY,JSON.stringify(c))}catch(e){}}
  return c}
function NOAI(){return window.claude?'這個功能要在 Claude 裡打開小助手才能使用。':'要先貼上 Gemini 金鑰才能用 AI 功能。 <button class="primary" data-open-ai="1">設定 AI</button>'}
function geminiSample(){
  const cfg=gemCfg();if(!cfg.key)return null;
  const toContents=input=>typeof input==='string'?[{role:'user',parts:[{text:input}]}]:input.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  async function blobPart(b){const buf=new Uint8Array(await b.arrayBuffer());let x='';for(let i=0;i<buf.length;i+=0x8000)x+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return {inline_data:{mime_type:b.type||'image/jpeg',data:btoa(x)}}}
  async function call(body,signal){
    const first=cfg.model||GEM_MODELS[0];const models=[first,...GEM_MODELS.filter(m=>m!==first)];let last;
    for(const m of models){let r;const tc=new AbortController();let timedOut=false;const tm=setTimeout(()=>{timedOut=true;tc.abort()},30000);
      if(signal)signal.addEventListener('abort',()=>tc.abort(),{once:true});
      try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key.trim()},body:JSON.stringify(body),signal:tc.signal})}
      catch(e){clearTimeout(tm);if(timedOut)throw {code:'timeout'};if(signal&&signal.aborted)throw {code:'cancelled'};throw {code:'network'}}
      clearTimeout(tm);
      const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||'';
      if(r.status===401||r.status===403||/API key not valid|API_KEY_INVALID|invalid api key/i.test(msg))throw {code:'bad_key'};
      if(r.status===400&&body.generationConfig&&body.generationConfig.thinkingConfig){delete body.generationConfig.thinkingConfig;return call(body,signal)}
      if(r.status===404||r.status===400||r.status>=500){last={code:'upstream_error',message:m+'：'+(msg||r.status)};continue}
      if(r.status===429)throw {code:'rate_limited'};
      if(!r.ok)throw {code:'upstream_error',message:msg||String(r.status)};
      if(cfg.model!==m){cfg.model=m;try{localStorage.setItem(GEM_KEY,JSON.stringify(cfg))}catch(e){}}
      return j}
    throw last||{code:'upstream_error'};
  }
  async function run(input,opts,json){
    opts=opts||{};const contents=toContents(input);
    if(opts.images){const list=opts.images instanceof Blob?[opts.images]:[...opts.images];const lastC=contents[contents.length-1];for(const b of list.slice(0,4))lastC.parts.push(await blobPart(b))}
    const body={contents,generationConfig:{thinkingConfig:{thinkingBudget:0}}};if(json)body.generationConfig.responseMimeType='application/json';
    const tools=opts.tools&&opts.tools.length?opts.tools:null;
    if(tools)body.tools=[{functionDeclarations:tools.map(t=>({name:t.name,description:t.description,parameters:t.inputSchema||{type:'object',properties:{}}}))}];
    let text='';
    for(let round=0;round<5;round++){
      const j=await call(body,opts.signal);
      const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const t=parts.filter(x=>x.text&&!x.thought).map(x=>x.text).join('');if(t)text+=(text?'\n\n':'')+t;
      const fcs=parts.filter(x=>x.functionCall);if(!fcs.length||!tools)break;
      contents.push({role:'model',parts});const resp=[];
      for(const x of fcs){const tool=tools.find(y=>y.name===x.functionCall.name);let res;
        try{res=tool?await tool.execute(x.functionCall.args||{},{signal:opts.signal||new AbortController().signal}):'unknown tool'}catch(e){res='Error: '+((e&&e.message)||e)}
        resp.push({functionResponse:{name:x.functionCall.name,response:{result:typeof res==='string'?res:JSON.stringify(res)}}})}
      contents.push({role:'user',parts:resp});
    }
    if(!text.trim())throw {code:'empty_completion'};
    if(opts.onText)try{opts.onText({text,delta:text})}catch(e){}
    return {text,truncated:false};
  }
  const fn=(input,opts)=>run(input,opts,false);
  fn.json=async(input,opts)=>{const r=await run(input,opts,true);try{return JSON.parse(r.text)}catch(e){const m=r.text.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(_){}}throw {code:'invalid_json',text:r.text}}};
  fn.limits=async()=>({maxPromptBytes:262144,images:{maxCount:4,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp']},tools:{maxCount:8}});
  fn.gemini=true;
  return fn;
}

- pay：銀行的刷卡／消費通知、簽帳金融卡或信用卡交易明細一律是 "card"；發票或收據上寫刷卡付款也是 "card"；其他收據、發票、現金交易是 "cash"
- cat 只能是其中之一：${CATS.map(c=>c[0]).join('、')}
- 若是銀行 App 的刷卡通知、推播或交易明細截圖，畫面上每一則通知或每一列交易都要分開成一筆，店家名稱寫在 note
- 一張發票或收據算一筆，金額用總額（不是單項）；明細檔則每一列消費一筆，跳過退款、轉帳、繳費以外的非消費列與標題列
- 民國年要換成西元年（民國 115 年 = 2026 年）；看不出年份就用 ${now.getFullYear()} 年；看不出日期就用 ${ymd(now)}
- 依店家判斷類別：超商、餐廳、飲料店歸「餐飲」；捷運、公車、加油、高鐵歸「交通」；書局、補習歸「學習」
- 找不到任何消費就回 []
只回 JSON 陣列，例如：[{"date":"2026-10-28","amt":65,"cat":"餐飲","note":"7-ELEVEN"}]
${text?'\n明細檔內容：\n'+text:''}`;
}
function cleanRows(arr){
  if(!Array.isArray(arr))return [];
  const names=CATS.map(c=>c[0]);
  return arr.map(r=>({date:/^\d{4}-\d{2}-\d{2}$/.test(String(r&&r.date))?String(r.date):ymd(now),
    amt:Math.round(Math.abs(Number(r&&r.amt))),cat:names.includes(r&&r.cat)?r.cat:'其他',note:String((r&&r.note)||'').slice(0,20),pay:(r&&r.pay)==='card'?'card':'cash'}))
    .filter(r=>r.amt>0&&r.amt<1e7);
}
async function runImport(files){
  if(!sampleFn||IMP.busy||!files.length)return;
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));
  const texts=[...files].filter(f=>!f.type.startsWith('image/'));
  IMP.busy=true;IMP.err='';IMP.rows=[];IMP.status='AI 正在讀你的資料…';updateImp();
  let rows=[];
  try{
    if(imgs.length){
      const lim=await sampleFn.limits().catch(()=>null);
      if(!lim||!lim.images){IMP.err='這個畫面目前不能傳照片給 AI，請改用明細檔。'}
      else{IMP.status=`AI 正在看 ${Math.min(imgs.length,lim.images.maxCount)} 張照片…`;updateImp();
        rows=rows.concat(cleanRows(await sampleFn.json(impPrompt('image'),{images:imgs.slice(0,lim.images.maxCount)})));}
    }
    for(const f of texts){
      IMP.status=`AI 正在讀 ${f.name}…`;updateImp();
      let t=await f.text();
      if(t.length>40000)t=t.slice(0,40000);
      rows=rows.concat(cleanRows(await sampleFn.json(impPrompt('text',t))));
    }
    if(!rows.length&&!IMP.err)IMP.err='AI 沒有在檔案裡找到消費紀錄，換一張清楚一點的照片或其他檔案試試。';
    IMP.src=files.length===1?files[0].name:files.length+' 個檔案';
    IMP.rows=rows;IMP.pick=rows.map(()=>true);
  }catch(e){
    IMP.err=e&&e.code==='invalid_json'?'AI 讀不太懂這個檔案，再試一次或換一個檔案。':e&&e.code==='image_rejected'?'照片格式不支援或太大，請換一張。':(errMsg(e,'連線出了點問題，請再試一次。'));
  }finally{IMP.busy=false;IMP.status='';updateImp()}
}

async function sendChat(text){
  text=text.trim();if(!text||CHAT.busy||!sampleFn)return;
  CHAT.err='';CHAT.turns.push({role:'user',content:text});CHAT.busy=true;CHAT.live='';CHAT.ctl=new AbortController();updateChat();
  const hist=CHAT.turns.filter(t=>t.role!=='note').slice(-12);
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const input=[{role:'user',content:chatContext()+'\n\n（以上是背景資料，接下來是對話）'},...hist];
  const opts={modelTier:'quick',signal:CHAT.ctl.signal,onText:({text})=>{CHAT.live=text;updateChat()}};
  const lim=await sampleFn.limits().catch(()=>null);
  const added=[];
  if(lim&&lim.tools){
    opts.tools=[{name:'add_expense',description:'當使用者要求記帳（例如「幫我記一筆午餐 120」）時，把一筆花費加進帳本。成功時回傳 ok。',
      inputSchema:{type:'object',properties:{amt:{type:'number',description:'金額，新台幣整數'},cat:{type:'string',enum:CATS.map(c=>c[0])},note:{type:'string',description:'品項或店家，12 字內'},pay:{type:'string',enum:['cash','card'],description:'付款方式：cash 現金、card 簽帳金融卡；使用者沒說就用 '+S.defPay},date:{type:'string',description:'YYYY-MM-DD，沒說就用今天'}},required:['amt','cat']},
      execute:(inp,ctx)=>{const amt=Math.round(Math.abs(Number(inp.amt)));if(!(amt>0))throw new Error('金額不正確');
        if(ctx.signal.aborted)throw new Error('已取消');
        const r={id:uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(String(inp.date))?String(inp.date):ymd(now),cat:CATS.some(c=>c[0]===inp.cat)?String(inp.cat):'其他',amt,note:String(inp.note||'').slice(0,20),pay:inp.pay==='card'?'card':inp.pay==='cash'?'cash':S.defPay};
        S.expenses.push(r);touched();added.push(r);return 'ok';}}];
  }else opts.cache=false;
  try{
    const r=await sampleFn(input,opts);
    CHAT.turns.push({role:'assistant',content:r.text});
  }catch(e){
    if(e&&e.text)CHAT.turns.push({role:'assistant',content:e.text});
    if(e&&e.code!=='cancelled')CHAT.err=errMsg(e,'連線出了點問題，請再傳一次。');
  }finally{
    added.forEach(a=>CHAT.turns.push({role:'note',content:`✓ 已記帳：${a.cat}・${a.note||''} ${money(a.amt)}（${PAYN[a.pay]}）`}));
    CHAT.busy=false;CHAT.live='';CHAT.ctl=null;updateChat();
  }
}

function ttiPrompt(isImg,text){
  return `請從${isImg?'附上的課表圖片':'下面的課表檔案內容'}找出每一節課，整理成 JSON。
這個 App 的節次時間：${PERIODS.map((p,i)=>`第${i+1}節 ${p[0]}-${p[1]}`).join('、')}。
規則：
- 每一格課一筆：{"day":星期幾(1=星期一 … ${DAYS.length}=星期${DAYS[DAYS.length-1]}),"period":節次(1-${PERIODS.length}),"name":"課程名稱","room":"教室，沒有就空字串"}
- 一門課佔連續兩節以上，每一節都要各列一筆
- 如果課表用的是時間而不是節次，依上面的節次時間對應到最接近的節次；如果學校的節次編號和這裡不同，以時間為準
- ${DAYS.length===6?'星期日':'星期六、星期日'}和超出第${PERIODS.length}節的課略過
- 課程名稱保留原文，不要加老師名字或學分
只回 JSON 陣列，例如：[{"day":1,"period":2,"name":"微積分","room":"理學院 201"}]
${text?'\n課表檔案內容：\n'+text:''}`;
}
async function runTti(file){
  if(!sampleFn||TTI.busy||!file)return;
  TTI.busy=true;TTI.err='';TTI.rows=[];updateTti();
  try{
    let raw;
    if(file.type.startsWith('image/')){
      const lim=await sampleFn.limits().catch(()=>null);
      if(!lim||!lim.images)throw {code:'_noimg'};
      raw=await sampleFn.json(ttiPrompt(true),{images:[file]});
    }else{
      let t=await file.text();
      if(/<html|<table/i.test(t)){const d=new DOMParser().parseFromString(t,'text/html');
        t=[...d.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()).join(' | ')).join('\n')||d.body.textContent;}
      raw=await sampleFn.json(ttiPrompt(false,t.slice(0,40000)));
    }
    const seen=new Set();
    TTI.rows=(Array.isArray(raw)?raw:[]).map(r=>({d:Math.round(Number(r&&r.day))-1,p:Math.round(Number(r&&r.period))-1,name:String((r&&r.name)||'').trim().slice(0,24),room:String((r&&r.room)||'').trim().slice(0,24)}))
      .filter(r=>r.d>=0&&r.d<DAYS.length&&r.p>=0&&r.p<PERIODS.length&&r.name&&!seen.has(r.d+'-'+r.p)&&seen.add(r.d+'-'+r.p));
    TTI.src=file.name;
    if(!TTI.rows.length)TTI.err='AI 沒有在這個檔案裡找到課程，換一張清楚一點的截圖試試。';
  }catch(e){
    TTI.err=e&&e.code==='_noimg'?'這個畫面目前不能傳圖片給 AI，請改用文字或網頁檔。':e&&e.code==='invalid_json'?'AI 讀不太懂這個檔案，再試一次或換一張截圖。':e&&e.code==='image_rejected'?'圖片格式不支援或太大，請換一張。':(errMsg(e,'連線出了點問題，請再試一次。'));
  }finally{TTI.busy=false;updateTti()}
}

const INC_RE=/領錢|提款|零用錢|生活費|收入|薪水|打工|獎學金|紅包|存入|入帳|轉入/;

const after=(arr,t)=>arr.filter(x=>x.ts>t);
function cashBal(){const w=S.wallet;if(!w)return null;
  return w.base+after(S.incomes,w.setAt).filter(x=>x.kind==='cash'||x.kind==='withdraw').reduce((a,x)=>a+x.amt,0)
    -after(S.expenses,w.setAt).filter(e=>payOf(e)==='cash').reduce((a,e)=>a+e.amt,0)}
function bankBal(){const w=S.bank;if(!w)return null;
  return w.base+after(S.incomes,w.setAt).filter(x=>x.kind==='bank').reduce((a,x)=>a+x.amt,0)
    -after(S.incomes,w.setAt).filter(x=>x.kind==='withdraw').reduce((a,x)=>a+x.amt,0)
    -after(S.expenses,w.setAt).filter(e=>payOf(e)==='card').reduce((a,e)=>a+e.amt,0)}

/* ---------- practice & metronome ---------- */
const PR_ITEMS=['爵士鼓','電貝斯','鋼琴','樂團排練','樂理','視唱聽寫'];
const MET={on:false,ctx:null,next:0,beat:0,timer:null,taps:[],lock:null};
const fmtMin=m=>m>=60?`${Math.floor(m/60)} 小時${m%60?' '+(m%60)+' 分':''}`:`${m} 分`;
function prOn(d){return S.practice.filter(x=>x.date===d).reduce((s,x)=>s+x.min,0)}
function prDays(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a}
function prStreak(){let k=0;const d=new Date();if(!prOn(ymd(d)))d.setDate(d.getDate()-1);while(prOn(ymd(d))>0){k++;d.setDate(d.getDate()-1)}return k}
function timerMs(){const t=S.prTimer;return t.acc+(t.start?Date.now()-t.start:0)}
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):pad(m))+':'+pad(x)}
function practiceTile(){
  const t=prOn(ymd(new Date())),g=S.prGoal;
  return `<button class="card tile" data-go="practice">
      <h3>今天練習</h3>
      <div class="num big">${t} <span class="small muted" style="font-family:var(--body)">/ ${g} 分鐘</span></div>
      <div class="bar"><i style="width:${Math.min(100,t/g*100)}%;background:var(--good)"></i></div>
      <div class="small muted">${S.prTimer.start?'⏱ 計時中：'+esc(S.prTimer.item):t>=g?'今天的目標達成了！':'還差 '+(g-t)+' 分鐘'}${prStreak()>1?' · 連續 '+prStreak()+' 天':''}</div>
    </button>`;
}
function weekChart(){
  const days=prDays(7),vals=days.map(d=>prOn(ymd(d))),g=S.prGoal;
  const max=Math.max(g,...vals,1),W=320,H=120,bw=W/7;
  const y=v=>H-v/max*(H-16);
  const bars=vals.map((v,i)=>{const h=v?Math.max(3,H-y(v)):0;const today=i===6;
    return `<rect x="${(i*bw+bw*.2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:${v>=g?'var(--good)':today?'var(--hi)':'var(--accent)'}"><title>${days[i].getMonth()+1}/${days[i].getDate()} ${v} 分鐘</title></rect>
      ${v?`<text x="${(i*bw+bw/2).toFixed(1)}" y="${(H-h-4).toFixed(1)}" text-anchor="middle" style="font-size:10px;fill:var(--ink)">${v}</text>`:''}
      <text x="${(i*bw+bw/2).toFixed(1)}" y="${H+15}" text-anchor="middle" style="font-size:11px;fill:${today?'var(--ink)':'var(--muted)'};font-weight:${today?700:400}">${today?'今天':'週'+'日一二三四五六'[days[i].getDay()]}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="最近 7 天練習時間"><line x1="0" y1="${y(g).toFixed(1)}" x2="${W}" y2="${y(g).toFixed(1)}" style="stroke:var(--good);stroke-dasharray:4 4"/><text x="${W}" y="${(y(g)-4).toFixed(1)}" text-anchor="end" style="font-size:10px;fill:var(--good)">目標 ${g} 分</text><line x1="0" y1="${H}" x2="${W}" y2="${H}" style="stroke:var(--line)"/>${bars}</svg>`;
}

function metClick(t,f,v){const c=MET.ctx,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.06)}
function metFlash(i,acc){const d=document.querySelectorAll('#metDots span');if(!d.length)return;d.forEach(x=>x.classList.remove('hit'));const el=d[i%d.length];if(el){el.classList.add('hit')}}
function metTick(){const c=MET.ctx,m=S.metro,spb=60/m.bpm/m.sub;
  while(MET.next<c.currentTime+0.12){const tot=m.beats*m.sub,i=MET.beat%tot,bar=i===0,beat=i%m.sub===0;
    metClick(MET.next,bar?1600:beat?1050:750,bar?0.5:beat?0.32:0.14);
    if(beat){const bi=Math.floor(i/m.sub),at=MET.next;setTimeout(()=>metFlash(bi,bar),Math.max(0,(at-c.currentTime)*1000))}
    MET.next+=spb;MET.beat++}}
function metStart(){
  try{if(!MET.ctx)MET.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){toast('這個瀏覽器不能播放聲音');return}
  MET.ctx.resume();MET.on=true;MET.beat=0;MET.next=MET.ctx.currentTime+0.08;MET.timer=setInterval(metTick,25);MET.used=S.metro.bpm;
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>MET.lock=l).catch(()=>{})}catch(e){}
}

function backupCode(withImg){
  const d=JSON.parse(JSON.stringify({...S,split:undefined,example:false}));
  if(!withImg)d.links=d.links.map(l=>({...l,img:l.img?'':l.img}));
  return 'ANZHU2:'+b64e(JSON.stringify(d));
}
function restoreCode(raw){
  raw=String(raw||'').trim().replace(/\s+/g,'');
  if(raw.startsWith('ANZHU1:'))throw new Error('這是課表代碼，請到「課表」頁的「帶到另一台裝置」貼上。');
  if(!raw.startsWith('ANZHU2:'))throw new Error('代碼不正確，請確認有整段複製（ANZHU2: 開頭）。');
  let d;try{d=JSON.parse(b64d(raw.slice(7)))}catch(e){throw new Error('代碼不完整，請重新複製一次。')}
  if(!d||!Array.isArray(d.expenses)||typeof d.courses!=='object')throw new Error('代碼內容不正確。');
  const oldImgs={};(S.links||[]).forEach(l=>{if(l.img)oldImgs[l.id]=l.img});
  S=d;S.example=false;
  (S.links||[]).forEach(l=>{if(l.kind==='doc'&&!l.img&&oldImgs[l.id])l.img=oldImgs[l.id]});
  normalize();
  if(!save())throw new Error('資料太大存不下，請改用不含照片的代碼。');
}

  if(e.target.dataset&&e.target.dataset.impI!==undefined){IMP.pick[+e.target.dataset.impI]=e.target.checked;
    const n=IMP.pick.filter(Boolean).length;const b=document.getElementById('impAdd');if(b){b.textContent='加入 '+n+' 筆';b.disabled=!n}return}
  if(e.target.id==='budget'){const v=+e.target.value;if(v>0){S.budget=v;touched();render()}}
  if(e.target.id==='spTitle'){S.split.title=e.target.value.trim()||'分帳';touched();render()}
  if(e.target.id==='metBeats'){S.metro.beats=+e.target.value;MET.beat=0;save();const d=document.getElementById('metDots');if(d)d.innerHTML=Array.from({length:S.metro.beats},(_,i)=>`<span class="${i===0?'acc':''}"></span>`).join('');return}
  if(e.target.id==='metSub'){S.metro.sub=+e.target.value;MET.beat=0;save();return}
  if(e.target.id==='prItem'){S.prTimer.item=e.target.value.trim();save();return}
  if(e.target.id==='prGoal'){const v=Math.round(+e.target.value);if(v>0){S.prGoal=v;touched();render()}return}
  if(e.target.id==='satToggle'){S.showSat=e.target.checked;applySettings();TT.open=true;touched();render();return}
  if(e.target.dataset&&e.target.dataset.pt){const[i,j]=e.target.dataset.pt.split('-').map(Number);const v=e.target.value;
    if(!/^\d\d:\d\d$/.test(v))return;const arr=PERIODS.map(x=>x.slice());arr[i][j]=v;setPeriods(arr);return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='metBpm'){setBpm(+e.target.value);return}
  if(e.target.id==='mSearch'){MV.q=e.target.value;const l=document.getElementById('expList');if(l)l.innerHTML=expListHTML(sortedMonth())}
});
window.addEventListener('hashchange',()=>{if(MET.on&&route()!=='practice')metStop();render()});
render();
</script>

</body>
</html>
